plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aktivesolutions.rolodex'
    compileSdk 35
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'com.aktivesolutions.rolodex'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '1.0.0-rc1'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            debuggable false
            minifyEnabled false
            // Signed with the debug keystore so RC builds remain sideloadable.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
